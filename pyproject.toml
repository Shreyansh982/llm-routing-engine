[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-agnostic-llm-routing-engine"
version = "0.1.0"
description = "Provider-agnostic LLM routing engine proof of concept"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
]

# The documented architecture intentionally uses a flat, multi-package layout.
# Explicit discovery prevents setuptools from rejecting those application packages.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "config*",
    "core*",
    "gateway*",
    "providers*",
    "registry*",
    "routers*",
    "routing*",
    "schemas*",
    "state*",
    "validation*",
]
exclude = ["tests*", "docs*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["api", "config", "core", "gateway", "providers", "registry", "routers", "routing", "schemas", "state", "validation"]

[tool.ruff]
line-length = 100
target-version = "py313"
